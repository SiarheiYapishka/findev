<div class="app-container">
      <h2 class="app-title">Fintech Wasm Dashboard</h2>
      
      <div class="nav-header">
        <button 
          class="nav-btn" 
          [class.active]="view === 'dashboard'" 
          (click)="view = 'dashboard'">
          Live Market
        </button>
        <button 
          class="nav-btn" 
          [class.active]="view === 'settings'" 
          (click)="view = 'settings'">
          Producer Settings
        </button>
      </div>
      
      @if (view === 'dashboard') {
        <app-dashboard></app-dashboard>
      }
      
      @if (view === 'settings') {
        <app-settings></app-settings>
      }
    </div>
